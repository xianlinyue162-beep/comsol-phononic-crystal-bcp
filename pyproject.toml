[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phononic-workflow"
version = "0.1.0"
description = "Small public helpers for COMSOL-style phononic workflow checks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yue Xianlin" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
